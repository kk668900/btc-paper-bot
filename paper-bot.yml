name: BTC paper bot
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-paper-bot
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main branch code
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
      - name: Set up persistent state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bot-state >/dev/null 2>&1; then
            git clone --single-branch --branch bot-state "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
          else
            mkdir state
            cd state
            git init -b bot-state
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            cd ..
          fi
          if [ ! -f state/state.json ]; then
            echo '{"balance":1000.0,"equity":1000.0,"position":null,"trades":0,"wins":0,"realized_pnl":0.0,"day":"1970-01-01","daily_start_balance":1000.0,"last_candle":0,"last_action":"初始化"}' > state/state.json
          fi
          if [ ! -f state/trades.csv ]; then
            echo 'time_utc,action,side,price,size_btc,pnl,balance,note' > state/trades.csv
          fi
          cp state/state.json code/state.json
          cp state/trades.csv code/trades.csv
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run one simulation tick
        working-directory: code
        run: python bot.py
      - name: Save state on bot-state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp code/state.json state/state.json
          cp code/trades.csv state/trades.csv
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json trades.csv
          git commit -m "Update paper bot state $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || exit 0
          git push origin HEAD:bot-state
